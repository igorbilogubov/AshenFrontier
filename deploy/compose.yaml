name: ashen-frontier
services:
  game:
    build: ..
    image: ashen-frontier:${ASHEN_RELEASE:-local}
    container_name: ashen-frontier
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    environment:
      NODE_ENV: production
      GAME_HOST: 0.0.0.0
      PORT: 4731
      GAME_PUBLIC_ORIGIN: ${GAME_PUBLIC_ORIGIN:?Set the exact public HTTPS game origin}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?Set the Google OAuth web client ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?Set the Google OAuth web client secret}
      GAME_DATA_DIR: /data
      NODE_OPTIONS: --max-old-space-size=192
      DATABASE_URL: postgresql://ashen_game:${ASHEN_DB_PASSWORD:?Set a random hex database password}@database:5432/ashen_frontier
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - /opt/ashen-frontier/data:/data
    networks:
      - proxy
      - database
    expose:
      - "4731"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.50
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  database:
    image: postgres:18.6-alpine
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      POSTGRES_DB: ashen_frontier
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${ASHEN_PG_ADMIN_PASSWORD:?Set a separate random PostgreSQL admin password}
      ASHEN_DB_PASSWORD: ${ASHEN_DB_PASSWORD:?Set a random hex database password}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/10-ashen.sh:ro
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ashen_frontier"]
      interval: 5s
      timeout: 3s
      retries: 10
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=30", "-c", "work_mem=2MB", "-c", "max_wal_size=512MB"]
    mem_limit: 384m
    cpus: 0.50
    pids_limit: 100
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
networks:
  database:
    internal: true
  proxy:
    external: true
    name: n8n_default
volumes:
  postgres-data:

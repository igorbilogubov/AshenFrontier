<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Воин · мастерская</title><link rel="stylesheet" href="./character-preview.css"></head>
<body><canvas id="portrait" aria-label="3D-модель воина" tabindex="0"></canvas>
<header><a href="/">← В локацию</a><p>ПЕПЕЛЬНЫЙ РУБЕЖ / МАСТЕРСКАЯ</p><h1>Страж опушки</h1><p>Модель и снаряжение в Blender · анимации Mixamo</p></header>

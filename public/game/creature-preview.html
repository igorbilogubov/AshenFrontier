<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Бестиарий · Пепельный рубеж</title><link rel="stylesheet" href="./character-preview.css"></head>
<body class="bestiary"><canvas id="portrait" aria-label="3D-модель существа" tabindex="0"></canvas>
<header><a href="/">← В локацию</a><p>ПЕПЕЛЬНЫЙ РУБЕЖ / БЕСТИАРИЙ</p><h1 id="creature-name">Обитатели опушки</h1><p>Модели и анимации созданы в Blender</p></header>
<aside><label>Существо<select id="creature"><option value="wolf">Пепельный волк</option><option value="boar">Лесной кабан</option><option value="alpha">Седой вожак</option><option value="bear">Пепельный медведь</option></select></label>
<label id="version-field">Версия волка<select id="version"><option value="after">После доработки</option><option value="before">До доработки</option></select></label><h2>Анимация</h2><div id="clips"></div>
<label>Ракурс<input id="angle" type="range" min="-180" max="180" value="-30"></label>
<label>Кадр<input id="timeline" type="range" min="0" max="1000" value="0"></label>
<button id="pause" type="button">Пауза</button><p id="status" role="status">Загружаем модели…</p><small>Атака: подготовка → выпад → восстановление. В игре выпад совпадает с окончанием оранжевого предупреждения.</small></aside>
<script type="module" src="./creature-preview.js"></script></body></html>
